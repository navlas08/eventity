services:
  rabbitmq:
    image: rabbitmq:management
    container_name: eventity-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  postgres:
    image: postgres:latest
    container_name: eventity-postgres
    environment:
      POSTGRES_DB: eventity
      POSTGRES_USER: eventity
      POSTGRES_PASSWORD: eventity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: